<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guidepost - Troubleshooting</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px;}
        button { background: #0066cc; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background: #005bb5; }
        .spinner { display: none; text-align: center; margin: 20px 0; font-style: italic; color: #666;}
        .results { margin-top: 20px; }
        .action-card { border-left: 4px solid #0066cc; background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; }
        .action-card.critical { border-left-color: #d93025; background: #fce8e6; }
        .action-card.manual { border-left-color: #f4b400; }
        .action-title { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .action-desc { color: #555; margin-bottom: 10px; }
        .deeplink { display: inline-block; background: #0066cc; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 14px; }
        .meta { margin-top: 20px; font-size: 12px; color: #888; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Device Troubleshooting</h1>
        <p>Describe your phone's issue:</p>
        <input type="text" id="queryInput" placeholder="e.g. My battery dies really fast..." />
        <button onclick="generateGuide()">Generate Guide</button>
        <div class="spinner" id="spinner">Analyzing issue...</div>
        <div class="results" id="results"></div>
    </div>

    <script>
        async function generateGuide() {
            const query = document.getElementById("queryInput").value;
            if(!query) return;
            
            document.getElementById("spinner").style.display = "block";
            document.getElementById("results").innerHTML = "";
            
            try {
                const res = await fetch("http://127.0.0.1:8000/v1/troubleshoot", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                
                document.getElementById("spinner").style.display = "none";
                renderResults(data);
            } catch (e) {
                document.getElementById("spinner").style.display = "none";
                document.getElementById("results").innerHTML = <p style="color:red">Error connecting to API. Is the server running?</p>;
            }
        }

        function renderResults(data) {
            const resultsDiv = document.getElementById("results");
            if (!data.response || !data.response.contexts || data.response.contexts.length === 0) {
                resultsDiv.innerHTML = <p>No suitable troubleshooting guide found ().</p>;
                return;
            }
            
            const ctx = data.response.contexts[0];
            let html = <h2></h2><p><em></em></p>;
            
            ctx.actions.forEach(action => {
                const isCritical = action.category === "critical";
                const isManual = action.category === "manual";
                const cssClass = isCritical ? "critical" : (isManual ? "manual" : "auto");
                
                html += <div class="action-card ">;
                html += <div class="action-title"> <small style="font-weight:normal;color:#888;">()</small></div>;
                html += <div class="action-desc"></div>;
                
                // Steps
                action.stepGroups.forEach(sg => {
                    if (sg.steps && sg.steps.length > 0) {
                        html += <ul>;
                        sg.steps.forEach(step => html += <li></li>);
                        html += </ul>;
                    }
                    
                    if (sg.actionableDeepLink && !isManual) {
                        html += <a href="#" class="deeplink" onclick="alert('Executing Deeplink: ')">Launch Settings</a>;
                    }
                });
                
                html += </div>;
            });
            
            const cost = data.meta && data.meta.cost_usd ? data.meta.cost_usd.toFixed(4) : "0.0000";
            html += <div class="meta">
                <strong>Telemetry:</strong> Latency: ms | Cache Hit:  | Cost: {cost}
            </div>;
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
